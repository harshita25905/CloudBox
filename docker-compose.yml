services:
  db:
    image: postgres:16

    container_name: cloudbox-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudbox

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    container_name: cloudbox-api

    depends_on:
      - db

    ports:
      - "8000:8000"

    env_file:
      - .env

volumes:
  postgres_data:
